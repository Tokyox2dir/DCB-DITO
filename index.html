<!doctype html>
<html lang="en" data-mui-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fav.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Lama Dev Admin Dashboard" />
    <title>Redpay Admin Panel</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* Firefox */
      input[type='number'] {
        -moz-appearance: textfield;
      }
    </style>
  </head>
  <body>
    <script>
      (function () {
        var t = 'dark'
        try {
          var saved = localStorage.getItem('dcb_theme')
          t = saved === 'light' || saved === 'dark' ? saved : saved === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } catch (_) { /* Use default if storage is unavailable. */ }
        document.documentElement.setAttribute('data-theme', t)
        document.documentElement.setAttribute('data-mui-color-scheme', t)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
